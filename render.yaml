services:
  - type: web
    name: finova-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FINOVA_DB
        value: /var/data/finova.db
      - key: FINOVA_SECRET_KEY
        generateValue: true
    disk:
      name: finova-data
      mountPath: /var/data
      sizeGB: 1
